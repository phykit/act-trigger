# Parties for Federal Circuit dockets with a precedential entry on GovInfo (metadata only; no prices).
name: govinfo-parties

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parties:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pandas requests
      - name: Fetch parties
        run: |
          mkdir -p data/appeals/logs
          set -o pipefail
          python scripts/govinfo_cafc_parties.py 2>&1 | tee data/appeals/logs/govinfo_parties.log
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/appeals/govinfo_cafc_parties.csv data/appeals/logs/govinfo_parties.log 2>/dev/null || exit 0
          git commit -m "GovInfo Federal Circuit parties $(date -u +%FT%H:%MZ) [skip ci]" || exit 0
          ok=0; for i in 1 2 3 4 5; do git pull --rebase --autostash -q origin main && git push && { ok=1; break; }; sleep 10; done; [ "$ok" = 1 ] || { echo "push failed after retries"; exit 1; }
