# Diagnostic only: what GovInfo and supremecourt.gov can supply from the runner. Uses no CourtListener requests.
name: govinfo-probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - name: Probe
        run: python scripts/govinfo_probe4.py
      - name: Commit the probe report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/appeals/govinfo_probe*.md 2>/dev/null || exit 0
          git commit -m "GovInfo probe report $(date -u +%FT%H:%MZ) [skip ci]" || exit 0
          ok=0; for i in 1 2 3 4 5; do git pull --rebase --autostash -q origin main && git push && { ok=1; break; }; sleep 10; done; [ "$ok" = 1 ] || { echo "push failed after retries"; exit 1; }
