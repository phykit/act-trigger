# Project Metal (prereg/metal_prereg.md): opinion complexity from CourtListener, after an appeals run has committed
# a complete universe. Opinion metrics are cached as numbers only and committed, so a throttled run resumes.
name: metal

on:
  workflow_dispatch:
    inputs:
      max_requests:
        description: "CourtListener requests allowed this run (0 = no cap); keep below the daily allowance"
        default: "100"

concurrency:
  group: metal
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
      CL_MAX_REQUESTS: ${{ inputs.max_requests || '100' }}
      SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pandas numpy scipy requests lxml yfinance
      - name: Require a complete universe
        run: |
          test -f data/appeals/universe.csv || { echo "no universe.csv; run the appeals workflow first"; exit 1; }
          cat data/appeals/universe_note.txt
      - name: Project Metal
        run: |
          set -o pipefail
          mkdir -p data/appeals/logs
          python scripts/metal.py 2>&1 | tee data/appeals/logs/metal.log
      - name: Commit results and opinion metrics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ data/appeals/logs/metal.log data/appeals/metal_opinion_metrics.csv 2>/dev/null || true
          git commit -m "Metal run $(date -u +%F) [skip ci]" || echo "nothing to commit"
          ok=0; for i in 1 2 3 4 5; do git pull --rebase --autostash -q origin main && git push && { ok=1; break; }; sleep 10; done; [ "$ok" = 1 ] || { echo "push failed after retries"; exit 1; }
