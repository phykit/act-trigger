name: appeals
# Run 8: as run 7 (quarterly Federal Circuit windows); the results commit now rebases onto main before pushing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/appeals_common.py"
      - "scripts/build_universe.py"
      - "scripts/earth.py"
      - "scripts/moon.py"
      - "scripts/fire.py"
      - "prereg/earth_prereg.md"
      - "prereg/moon_prereg.md"
      - "prereg/fire_prereg.md"
      - ".github/workflows/appeals.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
  COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --quiet pandas numpy scipy requests lxml "yfinance>=0.2.60"
      - name: Check CourtListener token (diagnostic only; never prints the value)
        continue-on-error: true
        run: |
          mkdir -p data/appeals/logs
          if [ -n "$COURTLISTENER_TOKEN" ]; then echo "COURTLISTENER_TOKEN present, length ${#COURTLISTENER_TOKEN}"; else echo "COURTLISTENER_TOKEN missing"; fi | tee data/appeals/logs/courtlistener_probe.log
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -H "Authorization: Token $COURTLISTENER_TOKEN" "https://www.courtlistener.com/api/rest/v4/search/?type=o&court=cafc&filed_after=2024-01-01")
          echo "CourtListener search HTTP $code" | tee -a data/appeals/logs/courtlistener_probe.log
      - name: Probe EDGAR access (diagnostic only)
        continue-on-error: true
        run: |
          mkdir -p data/appeals/logs
          for ua in "Simon Kittson skittson@gmail.com" "${SEC_CONTACT:-none}"; do
            for url in https://www.sec.gov/files/company_tickers.json https://data.sec.gov/submissions/CIK0000320193.json "https://efts.sec.gov/LATEST/search-index?q=%22Apple%22&forms=10-K"; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -H "User-Agent: $ua" -H "Accept-Encoding: gzip, deflate" "$url")
              echo "$code  ua=[$ua]  $url" | tee -a data/appeals/logs/edgar_probe.log
              sleep 1
            done
          done
      - name: Build universe and party map
        run: |
          mkdir -p data/appeals/logs
          set -o pipefail
          python scripts/build_universe.py 2>&1 | tee data/appeals/logs/build_universe.log
      - name: Project Earth
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/earth.py 2>&1 | tee data/appeals/logs/earth.log
      - name: Project Moon
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/moon.py 2>&1 | tee data/appeals/logs/moon.log
      - name: Project Fire
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/fire.py 2>&1 | tee data/appeals/logs/fire.log
      - name: Commit results and fetched inputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ data/appeals/
          git commit -m "Earth, Moon and Fire run $(date -u +%F) [skip ci]" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
