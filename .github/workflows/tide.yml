# Project Tide (prereg/tide_prereg.md). Modes:
#   probe - one page of each ODP PTAB endpoint, field structure only (data/tide/odp_probe.md); no prices
#   fetch - every ODP decision and proceeding, OCR text dropped (data/tide/odp_*.json.gz); no prices
#   run   - events, costs and statistics (scripts/tide.py); the PTAB arms run only once data/tide/ptab_decisions.csv exists
# The ODP key is the Actions secret USPTO_ODP_API_KEY, sent only as the X-API-KEY header; it is never printed.
name: tide

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe, fetch or run"
        default: "probe"

concurrency:
  group: tide
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      USPTO_ODP_API_KEY: ${{ secrets.USPTO_ODP_API_KEY }}
      SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pandas numpy scipy requests lxml yfinance
      - name: ODP probe
        if: ${{ inputs.mode == 'probe' }}
        run: |
          set -o pipefail
          mkdir -p data/tide/logs
          TIDE_PROBE=1 python scripts/tide_ptab_fetch.py 2>&1 | tee data/tide/logs/probe.log
      - name: ODP fetch
        if: ${{ inputs.mode == 'fetch' }}
        run: |
          set -o pipefail
          mkdir -p data/tide/logs
          python scripts/tide_ptab_fetch.py 2>&1 | tee data/tide/logs/fetch.log
      - name: Project Tide
        if: ${{ inputs.mode == 'run' }}
        run: |
          set -o pipefail
          mkdir -p data/tide/logs
          python scripts/tide.py 2>&1 | tee data/tide/logs/tide.log
      - name: Commit outputs
        if: always()
        run: |
          git add results/ data/tide/ data/appeals/ohlc_*.csv.gz 2>/dev/null || true
          bash scripts/ci/commit_push.sh "Tide ${{ inputs.mode }} $(date -u +%F) [skip ci]"
